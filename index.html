<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STARK DATABASE — Iron Man MCU Archive</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;900&family=Share+Tech+Mono&family=Barlow:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #080810;
  --surface: #0f0f1a;
  --card: #141422;
  --border: #252535;
  --border-hover: #404060;
  --red: #c0241e;
  --red-light: #e03030;
  --gold: #c8960a;
  --gold-light: #f0b820;
  --text: #ddd8cc;
  --text-muted: #888898;
  --text-dim: #555568;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Barlow', sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image:
    linear-gradient(rgba(192,36,30,0.025) 1px, transparent 1px),
    linear-gradient(90deg, rgba(192,36,30,0.025) 1px, transparent 1px);
  background-size: 60px 60px;
  pointer-events: none;
  z-index: 0;
}

/* ── HEADER ── */
header {
  border-bottom: 1px solid var(--border);
  padding: 0 24px;
  position: sticky;
  top: 0;
  background: rgba(8,8,16,0.96);
  backdrop-filter: blur(12px);
  z-index: 100;
}
.header-inner {
  max-width: 1200px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 0;
  gap: 16px;
}
.logo { display: flex; align-items: center; gap: 14px; }

.arc-small {
  width: 38px; height: 38px; border-radius: 50%;
  border: 2px solid var(--gold);
  display: flex; align-items: center; justify-content: center;
  position: relative;
  animation: pulse-ring 3s ease-in-out infinite;
  flex-shrink: 0;
}
.arc-small::before {
  content: '';
  position: absolute;
  width: 24px; height: 24px;
  border-radius: 50%;
  border: 1.5px solid var(--gold-light);
  animation: pulse-ring 3s ease-in-out infinite 0.5s;
}
.arc-small::after {
  content: '';
  position: absolute;
  width: 10px; height: 10px;
  border-radius: 50%;
  background: var(--gold-light);
  box-shadow: 0 0 14px var(--gold-light);
  animation: pulse-core 3s ease-in-out infinite;
}

@keyframes pulse-ring {
  0%, 100% { opacity: 0.65; }
  50% { opacity: 1; }
}
@keyframes pulse-core {
  0%, 100% { opacity: 0.8; transform: scale(0.88); box-shadow: 0 0 8px var(--gold-light); }
  50% { opacity: 1; transform: scale(1); box-shadow: 0 0 20px var(--gold-light); }
}

.logo-text {
  font-family: 'Orbitron', monospace;
  font-size: 13px; font-weight: 600;
  letter-spacing: 0.18em;
  color: var(--gold-light);
}
.logo-sub {
  font-family: 'Share Tech Mono', monospace;
  font-size: 9px; color: var(--text-dim);
  letter-spacing: 0.1em; margin-top: 3px;
}

.header-stats { display: flex; gap: 28px; }
.stat { text-align: right; }
.stat-num {
  color: var(--gold-light);
  font-size: 20px;
  font-family: 'Orbitron', monospace;
  font-weight: 600;
  line-height: 1;
}
.stat-label {
  font-family: 'Share Tech Mono', monospace;
  font-size: 9px; color: var(--text-dim);
  letter-spacing: 0.1em; margin-top: 3px;
}

/* ── NAV TABS ── */
.nav-wrap {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 0 24px;
}
.nav-tabs {
  max-width: 1200px; margin: 0 auto;
  display: flex; gap: 0;
}
.tab-btn {
  font-family: 'Orbitron', monospace;
  font-size: 10px; letter-spacing: 0.14em; font-weight: 600;
  padding: 13px 22px;
  background: none; border: none;
  color: var(--text-dim);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: all 0.2s;
  margin-bottom: -1px;
}
.tab-btn.active { color: var(--gold-light); border-bottom-color: var(--gold-light); }
.tab-btn:hover:not(.active) { color: var(--text); }

/* ── MAIN ── */
main {
  max-width: 1200px; margin: 0 auto;
  padding: 28px 24px 60px;
  position: relative; z-index: 1;
}
.section { display: none; }
.section.active { display: block; }

/* ── FILTERS ── */
.filters {
  display: flex; gap: 10px; flex-wrap: wrap;
  margin-bottom: 16px; align-items: center;
}
.search-input {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 4px;
  color: var(--text);
  font-family: 'Share Tech Mono', monospace;
  font-size: 12px; padding: 8px 14px;
  width: 220px; transition: border-color 0.2s;
}
.search-input:focus { outline: none; border-color: var(--gold); }
.search-input::placeholder { color: var(--text-dim); }

.film-filters { display: flex; gap: 5px; flex-wrap: wrap; }
.film-btn {
  font-family: 'Share Tech Mono', monospace;
  font-size: 10px; letter-spacing: 0.06em;
  padding: 5px 10px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 3px;
  color: var(--text-muted);
  cursor: pointer; transition: all 0.15s; white-space: nowrap;
}
.film-btn.active { background: var(--red); border-color: var(--red-light); color: #fff; }
.film-btn:hover:not(.active) { border-color: var(--border-hover); color: var(--text); }

.results-count {
  font-family: 'Share Tech Mono', monospace;
  font-size: 10px; color: var(--text-dim);
  margin-bottom: 16px; letter-spacing: 0.07em;
}

/* ── SUIT GRID ── */
.suit-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
  gap: 10px;
}
.suit-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 6px; overflow: hidden;
  cursor: pointer;
  transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
}
.suit-card:hover {
  transform: translateY(-3px);
  border-color: var(--border-hover);
  box-shadow: 0 10px 30px rgba(0,0,0,0.5);
}

/* ── SUIT THUMBNAIL ── */
.suit-thumb {
  height: 108px; position: relative;
  display: flex; align-items: center; justify-content: center;
  overflow: hidden;
}
.suit-thumb::before {
  content: '';
  position: absolute; inset: 0;
  background: repeating-linear-gradient(
    -45deg, transparent, transparent 6px,
    rgba(255,255,255,0.018) 6px, rgba(255,255,255,0.018) 7px
  );
}
.mark-display {
  font-family: 'Orbitron', monospace;
  font-weight: 900; font-size: 20px;
  z-index: 2; letter-spacing: 0.04em;
  color: rgba(255,255,255,0.9);
  text-shadow: 0 0 24px currentColor;
}
.arc-ring {
  position: absolute; border-radius: 50%;
  border: 1.5px solid rgba(255,255,255,0.12);
}
.arc-core {
  position: absolute; border-radius: 50%;
  width: 14px; height: 14px;
  background: rgba(255,255,255,0.25);
  box-shadow: 0 0 10px rgba(255,255,255,0.3);
  bottom: 12px; left: 50%; transform: translateX(-50%);
  animation: pulse-core 3s ease-in-out infinite;
}

/* Era backgrounds */
.era-im1 { background: linear-gradient(135deg, #1c0800, #2e1004); }
.era-im2 { background: linear-gradient(135deg, #0a1018, #141e2e); }
.era-av  { background: linear-gradient(135deg, #1c0408, #2e0810); }
.era-im3 { background: linear-gradient(135deg, #1c0c00, #2c1400); }
.era-aou { background: linear-gradient(135deg, #0c0c20, #181830); }
.era-cw  { background: linear-gradient(135deg, #0c1010, #141c1c); }
.era-iw  { background: linear-gradient(135deg, #180e00, #241800); }
.era-eg  { background: linear-gradient(135deg, #0a0a18, #141424); }
.era-sm  { background: linear-gradient(135deg, #0a0c1c, #10142c); }

.era-im1 .mark-display { color: #f5a060; }
.era-im2 .mark-display { color: #90b8d8; }
.era-av  .mark-display { color: #e06060; }
.era-im3 .mark-display { color: #e08040; }
.era-aou .mark-display { color: #a888e0; }
.era-cw  .mark-display { color: #70c0c0; }
.era-iw  .mark-display { color: #d0a030; }
.era-eg  .mark-display { color: #c090f0; }
.era-sm  .mark-display { color: #8898e0; }

/* Special suits */
.special-hulkbuster .mark-display { color: #f8c840 !important; text-shadow: 0 0 30px #f0900080 !important; }
.special-heartbreaker .mark-display { color: #ff5050 !important; text-shadow: 0 0 30px #ff000080 !important; }
.special-space .mark-display { color: #50d8ff !important; text-shadow: 0 0 30px #0090ff80 !important; }
.special-nano .mark-display { color: #40ffd8 !important; text-shadow: 0 0 30px #00d09080 !important; }
.special-suitcase .mark-display { color: #c8c8c8 !important; text-shadow: 0 0 30px #a0a0a080 !important; }

/* Suit card body */
.suit-body { padding: 10px 12px 12px; }
.suit-mark-label {
  font-family: 'Share Tech Mono', monospace;
  font-size: 10px; color: var(--text-dim);
  margin-bottom: 3px; letter-spacing: 0.05em;
}
.suit-name { font-size: 13px; font-weight: 500; color: var(--text); margin-bottom: 7px; line-height: 1.3; }
.suit-fn { font-size: 11px; color: var(--text-muted); line-height: 1.55; }

/* Film badges */
.film-badge {
  display: inline-block;
  font-family: 'Share Tech Mono', monospace;
  font-size: 10px; padding: 2px 7px;
  border-radius: 2px; margin-bottom: 6px;
}
.badge-im1 { background: rgba(200,80,20,0.18); color: #e09060; }
.badge-im2 { background: rgba(40,80,140,0.18); color: #80aadd; }
.badge-av  { background: rgba(180,20,30,0.18); color: #e07070; }
.badge-im3 { background: rgba(180,60,10,0.18); color: #e09050; }
.badge-aou { background: rgba(100,60,180,0.18); color: #b090e0; }
.badge-cw  { background: rgba(20,120,120,0.18); color: #60c0c0; }
.badge-iw  { background: rgba(160,90,10,0.18); color: #d0a050; }
.badge-eg  { background: rgba(80,40,160,0.18); color: #b080e0; }
.badge-sm  { background: rgba(40,50,160,0.18); color: #8090e0; }

/* ── AI SECTION ── */
.section-header {
  font-family: 'Orbitron', monospace;
  font-size: 10px; letter-spacing: 0.15em;
  color: var(--text-dim);
  margin: 0 0 14px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--border);
}
.ai-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 14px; margin-bottom: 32px;
}
.ai-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 8px; overflow: hidden;
  transition: transform 0.2s, border-color 0.2s;
}
.ai-card:hover { transform: translateY(-2px); border-color: var(--border-hover); }
.ai-header-band {
  height: 80px;
  display: flex; align-items: center; padding: 0 20px; gap: 16px;
  position: relative; overflow: hidden;
}
.ai-header-band::after {
  content: '';
  position: absolute; inset: 0;
  background: repeating-linear-gradient(
    -45deg, transparent, transparent 5px,
    rgba(255,255,255,0.018) 5px, rgba(255,255,255,0.018) 6px
  );
}
.ai-avatar {
  width: 48px; height: 48px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-family: 'Orbitron', monospace; font-size: 13px; font-weight: 700;
  position: relative; z-index: 1; flex-shrink: 0;
}
.ai-header-text { position: relative; z-index: 1; }
.ai-name-big {
  font-family: 'Orbitron', monospace;
  font-size: 14px; font-weight: 700;
  color: #fff; letter-spacing: 0.1em;
}
.ai-subtitle-small {
  font-family: 'Share Tech Mono', monospace;
  font-size: 9px; color: rgba(255,255,255,0.45);
  margin-top: 3px; letter-spacing: 0.06em;
}
.ai-body { padding: 14px 18px 16px; }
.ai-tags { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
.ai-tag {
  font-family: 'Share Tech Mono', monospace;
  font-size: 10px; padding: 2px 8px; border-radius: 2px;
}
.ai-tag-type {
  background: rgba(255,255,255,0.06);
  color: var(--text-muted);
}
.ai-desc { font-size: 13px; color: var(--text-muted); line-height: 1.65; margin-bottom: 10px; }
.ai-fate {
  font-size: 12px; color: var(--text-dim);
  border-top: 1px solid var(--border); padding-top: 10px;
}
.ai-fate strong { color: var(--text-muted); font-weight: 500; }

/* ── MODAL ── */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.88);
  z-index: 200; display: none;
  align-items: center; justify-content: center;
  padding: 24px;
}
.modal-overlay.open { display: flex; }
.modal {
  background: var(--card);
  border: 1px solid var(--border-hover);
  border-radius: 8px; max-width: 540px; width: 100%;
  overflow: hidden; position: relative;
}
.modal-thumb {
  height: 160px; position: relative;
  display: flex; align-items: center; justify-content: center;
}
.modal-thumb .mark-display { font-size: 52px; z-index: 2; }
.modal-thumb .arc-ring-lg {
  position: absolute; border-radius: 50%;
  border: 1.5px solid rgba(255,255,255,0.12);
}
.modal-thumb .arc-core-lg {
  position: absolute; border-radius: 50%;
  width: 20px; height: 20px;
  background: rgba(255,255,255,0.25);
  box-shadow: 0 0 16px rgba(255,255,255,0.3);
  bottom: 18px; left: 50%; transform: translateX(-50%);
  animation: pulse-core 3s ease-in-out infinite;
}
.modal-body { padding: 20px 24px 24px; }
.modal-close {
  position: absolute; top: 12px; right: 14px;
  background: none; border: none;
  color: var(--text-dim); font-size: 18px;
  cursor: pointer; z-index: 10; padding: 4px 8px;
  border-radius: 3px; transition: color 0.15s;
}
.modal-close:hover { color: var(--text); }
.modal-name {
  font-family: 'Orbitron', monospace;
  font-size: 17px; font-weight: 700;
  color: var(--text); margin-bottom: 5px;
}
.modal-meta {
  font-family: 'Share Tech Mono', monospace;
  font-size: 10px; color: var(--text-dim);
  margin-bottom: 12px; letter-spacing: 0.07em;
}
.modal-fn { font-size: 14px; color: var(--text-muted); line-height: 1.72; }

/* Highlight */
.hl { background: rgba(200,150,10,0.28); border-radius: 2px; color: var(--gold-light); }

/* Scrollbar */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--border-hover); }

/* Footer */
footer {
  text-align: center; padding: 36px 24px;
  font-family: 'Share Tech Mono', monospace;
  font-size: 10px; color: var(--text-dim);
  border-top: 1px solid var(--border);
  letter-spacing: 0.09em;
  position: relative; z-index: 1;
}

/* Responsive */
@media (max-width: 600px) {
  .header-stats { display: none; }
  .logo-sub { display: none; }
  .suit-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
  .ai-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<!-- HEADER -->
<header>
  <div class="header-inner">
    <div class="logo">
      <div class="arc-small"></div>
      <div>
        <div class="logo-text">STARK INDUSTRIES</div>
        <div class="logo-sub">CLASSIFIED SYSTEMS DATABASE &nbsp;·&nbsp; MCU ARCHIVE</div>
      </div>
    </div>
    <div class="header-stats">
      <div class="stat">
        <div class="stat-num" id="total-suits">—</div>
        <div class="stat-label">SUITS</div>
      </div>
      <div class="stat">
        <div class="stat-num">7</div>
        <div class="stat-label">AI SYSTEMS</div>
      </div>
      <div class="stat">
        <div class="stat-num">9</div>
        <div class="stat-label">FILMS</div>
      </div>
    </div>
  </div>
</header>

<!-- NAV -->
<div class="nav-wrap">
  <div class="nav-tabs">
    <button class="tab-btn active" onclick="switchTab('suits', this)">IRON SUITS</button>
    <button class="tab-btn" onclick="switchTab('ai', this)">AI SYSTEMS</button>
  </div>
</div>

<!-- MAIN -->
<main>

  <!-- SUITS SECTION -->
  <div id="section-suits" class="section active">
    <div class="filters">
      <input class="search-input" type="text" id="suit-search" placeholder="SEARCH SUITS..." oninput="renderSuits()">
      <div class="film-filters" id="film-filters"></div>
    </div>
    <div class="results-count" id="suits-count"></div>
    <div class="suit-grid" id="suit-grid"></div>
  </div>

  <!-- AI SECTION -->
  <div id="section-ai" class="section">
    <div class="section-header">PRIMARY AI SYSTEMS</div>
    <div class="ai-grid" id="ai-primary-grid"></div>
    <div class="section-header">ROBOTIC LAB UNITS</div>
    <div class="ai-grid" id="ai-robot-grid"></div>
  </div>

</main>

<!-- MODAL -->
<div class="modal-overlay" id="modal" onclick="closeModal(event)">
  <div class="modal" id="modal-box">
    <button class="modal-close" onclick="document.getElementById('modal').classList.remove('open')">✕</button>
    <div class="modal-thumb" id="modal-thumb">
      <div class="arc-ring-lg" style="width:120px;height:120px;"></div>
      <div class="arc-ring-lg" style="width:86px;height:86px;"></div>
      <div class="arc-ring-lg" style="width:54px;height:54px;"></div>
      <div class="arc-core-lg"></div>
      <div class="mark-display" id="modal-mark-display"></div>
    </div>
    <div class="modal-body">
      <div class="modal-name" id="modal-name"></div>
      <div class="modal-meta" id="modal-meta"></div>
      <div style="margin-bottom:14px;" id="modal-badge-wrap"></div>
      <div class="modal-fn" id="modal-fn"></div>
    </div>
  </div>
</div>

<footer>
  STARK INDUSTRIES CLASSIFIED ARCHIVE &nbsp;·&nbsp; COMPILED BY J.A.R.V.I.S. &nbsp;·&nbsp; FOR AUTHORIZED PERSONNEL ONLY
</footer>

// ================================================================
//  STATE
// ================================================================
let activeFilm = 'all';

// ================================================================
//  FILM FILTERS
// ================================================================
function renderFilmFilters() {
  const container = document.getElementById('film-filters');
  container.innerHTML = films.map(f =>
    `<button class="film-btn ${f.key === activeFilm ? 'active' : ''}" onclick="setFilm('${f.key}')">${f.label}</button>`
  ).join('');
}

function setFilm(key) {
  activeFilm = key;
  renderFilmFilters();
  renderSuits();
}

// ================================================================
//  HELPERS
// ================================================================
function hl(text, q) {
  if (!q) return text;
  const re = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
  return text.replace(re, '<span class="hl">$1</span>');
}

function truncate(text, len) {
  return text.length > len ? text.substring(0, len) + '…' : text;
}

// ================================================================
//  RENDER SUITS
// ================================================================
function renderSuits() {
  const q = document.getElementById('suit-search').value.trim().toLowerCase();
  const filtered = suits.filter(s => {
    const filmMatch = activeFilm === 'all' || s.movie === activeFilm;
    const textMatch = !q || s.name.toLowerCase().includes(q) || s.fn.toLowerCase().includes(q) || s.mark.toLowerCase().includes(q);
    return filmMatch && textMatch;
  });

  document.getElementById('suits-count').textContent =
    `DISPLAYING ${filtered.length} OF ${suits.length} REGISTERED SUITS`;

  document.getElementById('suit-grid').innerHTML = filtered.map(s => `
    <div class="suit-card" onclick="openModal('${s.mark.replace(/'/g,"\\'")}')">
      <div class="suit-thumb era-${s.era} ${s.special}">
        <div class="arc-ring" style="width:72px;height:72px;"></div>
        <div class="arc-ring" style="width:48px;height:48px;"></div>
        <div class="arc-core"></div>
        <div class="mark-display">${s.mark}</div>
      </div>
      <div class="suit-body">
        <div class="suit-mark-label">MARK ${s.mark} &nbsp;·&nbsp; ${s.year}</div>
        <div class="suit-name">${hl(s.name, q)}</div>
        <div><span class="film-badge ${s.badge}">${s.movie}</span></div>
        <div class="suit-fn">${hl(truncate(s.fn, 85), q)}</div>
      </div>
    </div>
  `).join('');
}

// ================================================================
//  MODAL
// ================================================================
function openModal(mark) {
  const s = suits.find(x => x.mark === mark);
  if (!s) return;
  const thumb = document.getElementById('modal-thumb');
  thumb.className = `modal-thumb era-${s.era} ${s.special}`;
  document.getElementById('modal-mark-display').textContent = s.mark;
  document.getElementById('modal-name').textContent = s.name;
  document.getElementById('modal-meta').textContent = `MARK ${s.mark}  ·  ${s.movie.toUpperCase()}  ·  ${s.year}`;
  document.getElementById('modal-badge-wrap').innerHTML = `<span class="film-badge ${s.badge}">${s.movie}</span>`;
  document.getElementById('modal-fn').textContent = s.fn;
  document.getElementById('modal').classList.add('open');
}

function closeModal(e) {
  if (e.target.id === 'modal') document.getElementById('modal').classList.remove('open');
}

// ================================================================
//  RENDER AI
// ================================================================
function renderAI() {
  const primary = ais.filter(a => a.type === 'primary');
  const robots  = ais.filter(a => a.type === 'robot');

  [['ai-primary-grid', primary], ['ai-robot-grid', robots]].forEach(([id, list]) => {
    document.getElementById(id).innerHTML = list.map(a => `
      <div class="ai-card">
        <div class="ai-header-band" style="background:${a.bandBg};">
          <div class="ai-avatar" style="background:${a.avatarBg};color:${a.avatarColor};border:1.5px solid ${a.avatarColor}55;">
            ${a.initials}
          </div>
          <div class="ai-header-text">
            <div class="ai-name-big">${a.name}</div>
            <div class="ai-subtitle-small">${a.full}</div>
          </div>
        </div>
        <div class="ai-body">
          <div class="ai-tags">
            <span class="ai-tag film-badge ${a.filmBadge}">${a.film}</span>
            <span class="ai-tag ai-tag-type">${a.tagType}</span>
          </div>
          <div class="ai-desc">${a.desc}</div>
          <div class="ai-fate"><strong>Fate: </strong>${a.fate}</div>
        </div>
      </div>
    `).join('');
  });
}

// ================================================================
//  TAB SWITCH
// ================================================================
function switchTab(tab, btn) {
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('section-' + tab).classList.add('active');
  btn.classList.add('active');
}
